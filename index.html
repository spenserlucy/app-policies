<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>CherryLi · App Privacy Policies</title>
<meta name="description" content="Official application privacy policies by CherryLi.">
<link rel="canonical" href="https://spenserlucy.github.io/app-policies/">
<style>
:root { color-scheme: light; --ink:#18283d; --muted:#526176; --blue:#075ecf;
  --paper:#fff; --line:#d6e0ec; --wash:#f2f3f6; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:1.5rem; }
body { margin:0; color:var(--ink); background:linear-gradient(145deg,#e7effc,var(--wash) 28rem);
  font-family:"Trebuchet MS","Noto Sans",sans-serif; font-size:1rem; line-height:1.75; }
a { color:var(--blue); overflow-wrap:anywhere; text-underline-offset:.2em; }
a:focus-visible { outline:3px solid var(--blue); outline-offset:4px; }
.shell { max-width:58rem; margin:auto; padding:2rem 1.25rem 3rem; }
header { display:flex; flex-wrap:wrap; gap:.75rem 2rem; justify-content:space-between;
  align-items:center; margin-bottom:1.5rem; }
.brand { color:var(--ink); font-weight:bold; text-decoration:none; letter-spacing:.04em; }
nav { display:flex; flex-wrap:wrap; gap:1rem; font-size:.95rem; }
main { background:var(--paper); border:1px solid var(--line); border-top:5px solid var(--blue);
  border-radius:1rem; padding:clamp(1.25rem,4vw,3rem); box-shadow:0 15px 50px #18283d08; }
h1,h2 { line-height:1.3; font-family:Georgia,"Noto Serif",serif; }
h1 { font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 1.5rem; overflow-wrap:anywhere; }
h2 { font-size:1.3rem; margin:2.25rem 0 .75rem; }
p { margin:.85rem 0; }
ul { padding-left:1.4rem; }
li { margin:.45rem 0; }
.language + .language { margin-top:3rem; padding-top:3rem; border-top:1px solid var(--line); }
footer { margin-top:1.5rem; color:var(--muted); font-size:.875rem; }
@media (max-width:480px) { .shell { padding:1rem .75rem 2rem; } main { border-radius:.6rem; } }
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
</style>
</head>
<body>
<div class="shell">
<header><a class="brand" href="https://spenserlucy.github.io/app-policies/">CherryLi · App Policies</a></header>
<main><h1>App Privacy Policies</h1>
<p>Applications by <strong>CherryLi</strong>. Each application has its own policy and scope.</p>
<h2>Clipsway / 随贴 / 隨貼</h2>
<p>A local clipboard history and text-input utility for Android.</p>
<p><a href="clipsway/privacy/">Privacy Policy · 隐私政策</a> — English / 简体中文</p></main>
<footer>CherryLi · <a href="mailto:cherryli@suyoua.com">cherryli@suyoua.com</a></footer>
</div>
</body>
</html>
